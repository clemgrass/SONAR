# Estado del proyecto — legible por máquina
#
# Responde "¿en qué estado está esto?" sin leer todo el corpus de documentación.
# Se mantiene CORTO a propósito: actualizarlo es el primer paso de la Definition of
# Done de cada ticket, y un archivo largo se desactualiza (spec §6.4).

project:
  name: sonar
  status: paused                   # en pausa desde 2026-11-25; v0.1.1 publicada como prototipo

milestone:
  current: M1
  goal: validar si extrapolar lecturas de sonar es satisfactorio
  exit_criteria: docs/development/m1-findings.md con las ocho preguntas respondidas

toolchain:
  dotnet_sdk: 10.0.110
  target_framework: net9.0
  godot: 4.7.stable.mono
  godot_binary: godot-mono          # el binario `godot` es la build sin C#
  test_framework: xunit

  notes:
    - "dotnet new sln requiere --format sln: el SDK 10 genera .slnx por defecto y el fallo es silencioso"
    - "dotnet new classlib/xunit generan net10.0 por defecto; hay que corregir a net9.0 a mano"
    - "el export de Godot exige src/Sonar.Game/Sonar.Game.sln, aparte de Sonar.sln (que sigue sin el juego)"

architecture:
  chain: Sonar.Game (Godot) -> Sonar.Autopilot -> Sonar.Controller -> Sonar.Core
  rule: ni Core ni Controller ni Autopilot referencian Godot; esa ausencia es el enforcement

progress:
  plan_1_foundation: done          # 10/10 tareas, 78 tests
  plan_2_world_tick: done          # 10/10 tareas, 120 tests
  plan_3_combat_threat: done       # 10/10 tareas, 171 tests
  plan_4_sonar_controller_godot: done
    # 10/10. La escena de Godot es un prototipo feo a propósito, hecho sólo para poder
    # validar el gameplay de M1. El diseño visual definitivo se hace después, cuando las
    # ocho preguntas estén respondidas. Contrato en docs/development/godot-wiring.md.
  plan_5_gauntlet_rules: done      # 10/10 tareas, 295 tests
  plan_6_watch_and_telemetry: done   # 10/10 tareas
  plan_7_enemy_mind: done            # 11/11 + una tarea 12 que salió al cerrar; 336 tests
  plan_8_held_fire_and_telemetry: done  # 8/8; 352 tests. Falta sólo conectar el remoto
  plan_9_autopilot_and_the_wall: done   # 14/14; 411 tests
    # Primera vez que se ven las oleadas 2, 3 y 4. El hallazgo no fue la pared de ritmo que
    # se buscaba: las cinco semillas gastan el pañol completo —quince torpedos— y tres de
    # ellas quedan a la deriva sin poder matar ni morir. Ver m1-findings.md.

systems:
  spatial_primitives: done         # Vec2, Bearing, Band, BandLayout, TargetCoordinate
  config_and_validation: done
  random_source: in_use            # el WaveDirector es el primer consumidor real
  entities: done
  tick_loop: done
  combat: done
  enemy_threat: done               # personalidades, puntería por ruido, gobierno, fuego amigo evitado
  wave_gauntlet: done              # oleadas dobladoras, spawns de borde, START y RETRY
  shot_telemetry: done             # ShotAssessed en Core, JSONL incremental en Game
  sonar_gating: done               # cruce de barrido + lecturas con gating
  controller: done                 # parser, snapshot, acumulador con tope
  godot_presentation: prototype    # guardia legible y medida; el diseño visual va tras M1
  autopilot: done                  # piloto que juega leyendo sólo el snapshot, e índice de saturación
  demo_mode: done                  # `make demo`: el bot juega en el scope real, mismos números que el test

open_decisions:
  - band_count                     # 5 u 8 -> M1 pregunta 5
  - bearing_zero_padding
  - hit_and_blast_radii            # M1 pregunta 5
  - near_miss_window_width
  - sweep_period                   # M1 pregunta 4
  - repeat_and_fine_adjust_commands # M1 pregunta 6
  - salvo_command                  # M1 pregunta 7
  - cross_platform_bit_determinism # solo si se quieren replays compartibles

release:
  v0_1_0: "build del prototipo M1 para Windows y Linux (`make export`); la config va embebida"
  v0_1_1: "el mismo build, sin .pdb ni rutas locales en los ensamblados (Directory.Build.props)"

documents:
  gdd: GAME DESIGN DOCUMENT.md
  spec: docs/superpowers/specs/2026-08-11-sonar-preproduction-design.md
  tdd: docs/tdd/M1-core-simulation.md
  plans: docs/superpowers/plans/
